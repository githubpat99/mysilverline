  <g filter="url(#soft)">
    <!-- Single-path "S" with rounded, modern feel -->
    <path
      fill="none"
      stroke="url(#g)"
      stroke-width="44"
      stroke-linecap="round"
      stroke-linejoin="round"
      d="
        M 368 170
        C 200 150 250 100 190 120
        C 170 112 144 148 144 196
        C 144 250 210 262 266 274
        C 326 287 368 302 368 352
        C 368 406 314 432 256 432
        C 203 432 162 410 140 372
      "
    />
  </g>
</svg>
